<link rel="icon" type="image/png" href="favicon.png">
<style>

/* ==============================
   PARADISE — USERNAME GENERATOR
================================= */

html,
body,
#main-wrapper,
.main-wrapper,
.content-outer,
.content-inner,
.main,
.section,
.widget,
.post,
.post-body {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
}

.paradiseUserGen,
.paradiseUserGen * {
    box-sizing: border-box;
}

.paradiseUserGen {

    --pg-bg-1: #08111f;
    --pg-bg-2: #0d1728;
    --pg-bg-3: #111c30;

    --pg-primary: #00c8ff;
    --pg-primary-2: #1da1ff;

    --pg-text: #ffffff;
    --pg-text-secondary: #c8d8e8;

    --pg-border: rgba(0, 200, 255, 0.15);
    --pg-border-hover: rgba(0, 200, 255, 0.45);

    --pg-glow: rgba(0, 200, 255, 0.35);
    --pg-glow-soft: rgba(0, 200, 255, 0.12);

    width: 100%;
    min-height: 100vh;

    position: relative;
    isolation: isolate;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 50px 18px;

    overflow: hidden;

    color: var(--pg-text);

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(29, 161, 255, 0.2),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(0, 200, 255, 0.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            var(--pg-bg-1),
            #050b14 48%,
            var(--pg-bg-2)
        );
}

/* Galaxy stars */

.paradiseUserGen::before {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0.7;

    background-image:
        radial-gradient(
            circle,
            rgba(255, 255, 255, 0.75) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(0, 200, 255, 0.7) 1px,
            transparent 1.5px
        );

    background-size:
        75px 75px,
        115px 115px;

    background-position:
        0 0,
        35px 45px;

    animation:
        pgStarsMove 45s linear infinite;
}

/* Ambient blue lighting */

.paradiseUserGen::after {

    content: "";

    position: absolute;

    width: 680px;
    height: 680px;

    top: -340px;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    pointer-events: none;

    background:
        rgba(0, 200, 255, 0.18);

    filter: blur(130px);

    animation:
        pgAmbientPulse 6s ease-in-out infinite alternate;
}

/* Main dashboard card */

.pg-box {

    width: 100%;
    max-width: 920px;

    position: relative;
    z-index: 2;

    overflow: hidden;

    padding: 28px;

    border:
        1px solid var(--pg-border);

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(17, 28, 48, 0.78),
            rgba(8, 17, 31, 0.66)
        );

    backdrop-filter:
        blur(28px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(140%);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(0, 200, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

    animation:
        pgCardEnter 0.7s ease both;
}

/* Glass reflection */

.pg-box::before {

    content: "";

    position: absolute;

    width: 70%;
    height: 180%;

    top: -60%;
    left: -90%;

    pointer-events: none;

    transform: rotate(22deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.045),
            transparent
        );

    animation:
        pgGlassReflection 8s ease-in-out infinite;
}

/* Outer cyan bloom */

.pg-box::after {

    content: "";

    position: absolute;

    width: 260px;
    height: 260px;

    right: -140px;
    bottom: -150px;

    pointer-events: none;

    border-radius: 50%;

    background:
        rgba(0, 200, 255, 0.16);

    filter: blur(65px);
}

/* Header */

.pg-header {

    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 18px;

    margin-bottom: 24px;
    padding-bottom: 20px;

    border-bottom:
        1px solid rgba(0, 200, 255, 0.1);
}

.pg-header-left {

    display: flex;
    align-items: center;

    gap: 14px;
}

.pg-logo {

    width: 50px;
    height: 50px;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-shrink: 0;

    border:
        1px solid rgba(0, 200, 255, 0.3);

    border-radius: 16px;

    color: #ffffff;

    font-size: 22px;
    font-weight: 800;

    background:
        linear-gradient(
            145deg,
            rgba(0, 200, 255, 0.22),
            rgba(29, 161, 255, 0.06)
        );

    box-shadow:
        0 0 24px rgba(0, 200, 255, 0.18),
        inset 0 0 16px rgba(0, 200, 255, 0.08);

    animation:
        pgLogoPulse 3s ease-in-out infinite;
}

.pg-title {

    margin: 0;

    font-size: clamp(23px, 4vw, 31px);
    font-weight: 750;
    letter-spacing: -0.6px;

    color: #ffffff;
}

.pg-subtitle {

    margin-top: 5px;

    color: var(--pg-text-secondary);

    font-size: 13px;
    line-height: 1.5;
}

.pg-status {

    display: inline-flex;
    align-items: center;

    gap: 8px;

    flex-shrink: 0;

    padding: 9px 13px;

    border:
        1px solid rgba(0, 200, 255, 0.2);

    border-radius: 999px;

    color: #bfeeff;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;

    background:
        rgba(0, 200, 255, 0.07);

    box-shadow:
        inset 0 0 15px rgba(0, 200, 255, 0.05);
}

.pg-status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        var(--pg-primary);

    box-shadow:
        0 0 10px var(--pg-primary),
        0 0 20px var(--pg-glow);

    animation:
        pgStatusPulse 1.8s ease-in-out infinite;
}

/* Form panels */

.pg-panel {

    position: relative;
    z-index: 2;

    padding: 18px;

    border:
        1px solid rgba(0, 200, 255, 0.11);

    border-radius: 19px;

    background:
        rgba(6, 15, 28, 0.48);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
}

.pg-panel:hover {

    border-color:
        rgba(0, 200, 255, 0.23);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
}

.pg-label-row {

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 12px;

    margin-bottom: 11px;
}

.pg-label {

    color: #ffffff;

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.pg-counter {

    color: #8fdfff;

    font-size: 12px;
    font-weight: 600;
}

/* Separator options */

.pg-separator-panel {

    margin-top: 15px;
}

.pg-separator-options {

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 10px;
}

.pg-separator-option {

    position: relative;

    display: block;

    cursor: pointer;
}

.pg-separator-option input {

    position: absolute;

    width: 1px;
    height: 1px;

    opacity: 0;
    pointer-events: none;
}

.pg-separator-card {

    min-height: 72px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 5px;

    padding: 12px 9px;

    border:
        1px solid rgba(0, 200, 255, 0.12);

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            rgba(8, 17, 31, 0.76),
            rgba(13, 23, 40, 0.62)
        );

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}

.pg-separator-option:hover .pg-separator-card {

    transform: translateY(-2px);

    border-color:
        rgba(0, 200, 255, 0.34);
}

.pg-separator-symbol {

    color: #ffffff;

    font-size: 18px;
    font-weight: 800;
    line-height: 1;
}

.pg-separator-name {

    color: var(--pg-text-secondary);

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25px;
}

.pg-separator-option input:checked + .pg-separator-card {

    border-color:
        rgba(0, 200, 255, 0.65);

    background:
        linear-gradient(
            145deg,
            rgba(0, 200, 255, 0.18),
            rgba(29, 161, 255, 0.08)
        );

    box-shadow:
        0 0 0 3px rgba(0, 200, 255, 0.07),
        0 0 24px rgba(0, 200, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.pg-separator-option input:focus-visible + .pg-separator-card {

    outline:
        2px solid rgba(91, 220, 255, 0.9);

    outline-offset: 3px;
}


/* Number options */

.pg-number-settings {
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 12px;
}

.pg-number-field {
    min-width: 0;
}

.pg-number-field .pg-label {
    display: block;
    margin-bottom: 9px;
}

.pg-number-input {
    width: 100%;
    min-height: 52px;
    padding: 0 14px;
    border: 1px solid rgba(0, 200, 255, 0.12);
    border-radius: 13px;
    outline: none;
    color: #ffffff;
    caret-color: var(--pg-primary);
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(
        145deg,
        rgba(8, 17, 31, 0.82),
        rgba(13, 23, 40, 0.7)
    );
    box-shadow: inset 0 4px 18px rgba(0, 0, 0, 0.18);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.pg-number-input:hover {
    border-color: rgba(0, 200, 255, 0.28);
}

.pg-number-input:focus {
    border-color: rgba(0, 200, 255, 0.55);
    box-shadow:
        0 0 0 4px rgba(0, 200, 255, 0.07),
        inset 0 4px 18px rgba(0, 0, 0, 0.2);
}

.pg-position-options {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
}

.pg-position-option {
    position: relative;
    display: block;
    cursor: pointer;
}

.pg-position-option input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.pg-position-card {
    min-height: 52px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid rgba(0, 200, 255, 0.12);
    border-radius: 13px;
    color: var(--pg-text-secondary);
    font-size: 12px;
    font-weight: 750;
    text-align: center;
    background: linear-gradient(
        145deg,
        rgba(8, 17, 31, 0.76),
        rgba(13, 23, 40, 0.62)
    );
    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}

.pg-position-option:hover .pg-position-card {
    transform: translateY(-2px);
    border-color: rgba(0, 200, 255, 0.34);
}

.pg-position-option input:checked + .pg-position-card {
    color: #ffffff;
    border-color: rgba(0, 200, 255, 0.65);
    background: linear-gradient(
        145deg,
        rgba(0, 200, 255, 0.18),
        rgba(29, 161, 255, 0.08)
    );
    box-shadow:
        0 0 0 3px rgba(0, 200, 255, 0.07),
        0 0 24px rgba(0, 200, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.pg-position-option input:focus-visible + .pg-position-card {
    outline: 2px solid rgba(91, 220, 255, 0.9);
    outline-offset: 3px;
}

/* Text areas */

.pg-textarea {

    display: block;

    width: 100%;
    height: 195px;

    padding: 17px;

    resize: vertical;

    outline: none;

    border:
        1px solid rgba(0, 200, 255, 0.1);

    border-radius: 14px;

    color:
        var(--pg-text);

    caret-color:
        var(--pg-primary);

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 14px;
    line-height: 1.7;

    background:
        linear-gradient(
            145deg,
            rgba(8, 17, 31, 0.82),
            rgba(13, 23, 40, 0.7)
        );

    box-shadow:
        inset 0 4px 18px rgba(0, 0, 0, 0.18);

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
}

.pg-textarea::placeholder {

    color:
        rgba(200, 216, 232, 0.48);
}

.pg-textarea:hover {

    border-color:
        rgba(0, 200, 255, 0.22);
}

.pg-textarea:focus {

    border-color:
        rgba(0, 200, 255, 0.55);

    background:
        rgba(8, 17, 31, 0.92);

    box-shadow:
        0 0 0 4px rgba(0, 200, 255, 0.07),
        0 0 25px rgba(0, 200, 255, 0.1),
        inset 0 4px 18px rgba(0, 0, 0, 0.2);
}

#pgOutput {

    height: 245px;
}

/* Buttons */

.pg-actions {

    position: relative;
    z-index: 2;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 13px;

    margin: 15px 0;
}

.pg-btn {

    position: relative;

    min-height: 54px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    overflow: hidden;

    border:
        1px solid rgba(0, 200, 255, 0.32);

    border-radius: 14px;

    outline: none;

    cursor: pointer;

    color: #ffffff;

    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.65px;

    background:
        linear-gradient(
            135deg,
            rgba(0, 200, 255, 0.92),
            rgba(29, 161, 255, 0.88)
        );

    box-shadow:
        0 10px 25px rgba(0, 120, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

    transition:
        transform 0.28s ease,
        box-shadow 0.28s ease,
        filter 0.28s ease;
}

.pg-btn::before {

    content: "";

    position: absolute;

    width: 40px;
    height: 180%;

    top: -40%;
    left: -70px;

    transform: rotate(20deg);

    background:
        rgba(255, 255, 255, 0.28);

    filter: blur(4px);

    transition:
        left 0.55s ease;
}

.pg-btn:hover {

    transform:
        translateY(-3px);

    filter:
        brightness(1.08);

    box-shadow:
        0 14px 32px rgba(0, 140, 255, 0.28),
        0 0 25px rgba(0, 200, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.pg-btn:hover::before {

    left: calc(100% + 35px);
}

.pg-btn:active {

    transform:
        translateY(0)
        scale(0.985);
}

.pg-btn-secondary {

    background:
        linear-gradient(
            145deg,
            rgba(17, 28, 48, 0.92),
            rgba(8, 17, 31, 0.9)
        );

    color:
        #cceeff;

    border-color:
        rgba(0, 200, 255, 0.2);

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.045);
}

.pg-btn-secondary:hover {

    border-color:
        rgba(0, 200, 255, 0.48);

    box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25),
        0 0 25px rgba(0, 200, 255, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.065);
}

.pg-btn-icon {

    font-size: 17px;
}

/* Toast */

#pgToast {

    position: fixed;

    right: 22px;
    bottom: 22px;

    z-index: 99999;

    max-width: calc(100% - 44px);

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 15px 19px;

    border:
        1px solid rgba(0, 200, 255, 0.32);

    border-radius: 14px;

    color:
        #ffffff;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 13px;
    font-weight: 650;

    background:
        linear-gradient(
            145deg,
            rgba(13, 23, 40, 0.96),
            rgba(8, 17, 31, 0.96)
        );

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.42),
        0 0 25px rgba(0, 200, 255, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(25px)
        scale(0.96);

    transition:
        opacity 0.35s ease,
        visibility 0.35s ease,
        transform 0.35s ease;
}

#pgToast::before {

    content: "";

    width: 9px;
    height: 9px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--pg-primary, #00c8ff);

    box-shadow:
        0 0 12px #00c8ff;
}

#pgToast.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

/* Custom scrollbar */

.pg-textarea::-webkit-scrollbar {

    width: 9px;
}

.pg-textarea::-webkit-scrollbar-track {

    background:
        rgba(8, 17, 31, 0.65);

    border-radius: 20px;
}

.pg-textarea::-webkit-scrollbar-thumb {

    border:
        2px solid rgba(8, 17, 31, 0.8);

    border-radius: 20px;

    background:
        linear-gradient(
            #00c8ff,
            #1da1ff
        );
}

.pg-textarea::-webkit-scrollbar-thumb:hover {

    background:
        #5bdcff;
}

/* Animations */

@keyframes pgStarsMove {

    from {
        background-position:
            0 0,
            35px 45px;
    }

    to {
        background-position:
            150px 250px,
            -120px 220px;
    }
}

@keyframes pgAmbientPulse {

    from {
        opacity: 0.55;
        transform:
            translateX(-50%)
            scale(0.92);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1.08);
    }
}

@keyframes pgCardEnter {

    from {
        opacity: 0;
        transform:
            translateY(24px)
            scale(0.985);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes pgGlassReflection {

    0%,
    35% {
        left: -90%;
    }

    65%,
    100% {
        left: 140%;
    }
}

@keyframes pgLogoPulse {

    0%,
    100% {
        box-shadow:
            0 0 20px rgba(0, 200, 255, 0.13),
            inset 0 0 16px rgba(0, 200, 255, 0.07);
    }

    50% {
        box-shadow:
            0 0 30px rgba(0, 200, 255, 0.28),
            inset 0 0 20px rgba(0, 200, 255, 0.12);
    }
}

@keyframes pgStatusPulse {

    0%,
    100% {
        opacity: 0.65;
        transform: scale(0.85);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* Mobile */

@media (max-width: 650px) {

    .paradiseUserGen {

        padding:
            22px 12px;
    }

    .pg-box {

        padding: 17px;

        border-radius: 20px;
    }

    .pg-header {

        align-items: flex-start;
    }

    .pg-logo {

        width: 45px;
        height: 45px;

        border-radius: 14px;
    }

    .pg-status {

        display: none;
    }

    .pg-actions {

        grid-template-columns: 1fr;
    }

    .pg-panel {

        padding: 13px;
    }

    .pg-separator-options {

        grid-template-columns: 1fr 1fr;
    }

    .pg-position-options {
        grid-template-columns: 1fr 1fr;
    }

    .pg-number-settings {

        grid-template-columns: 1fr;
    }

    .pg-textarea {

        height: 180px;
    }

    #pgOutput {

        height: 220px;
    }

    #pgToast {

        right: 12px;
        bottom: 12px;

        max-width:
            calc(100% - 24px);
    }
}

@media (prefers-reduced-motion: reduce) {

    .paradiseUserGen::before,
    .paradiseUserGen::after,
    .pg-box,
    .pg-box::before,
    .pg-logo,
    .pg-status-dot {

        animation: none !important;
    }

    .pg-btn,
    .pg-panel,
    .pg-textarea,
    #pgToast {

        transition-duration:
            0.01ms !important;
    }
}

/*==========================
BADGE SHINE EFFECT
==========================*/
.badge{

    display:inline-block;

    position:relative;

    overflow:hidden;

    padding:8px 18px;

    border-radius:50px;

    background:linear-gradient(135deg,#00d4ff,#0078ff);

    font-size:12px;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0 0 18px rgba(0,212,255,.45);

    margin-bottom:16px;

}



.badge::after{

    content:"";

    position:absolute;

    top:-70%;

    left:-120%;

    width:60%;

    height:240%;

    transform:rotate(25deg);

    background:

    linear-gradient(

        transparent,

        rgba(255,255,255,.45),

        transparent

    );

    animation:badgeShine 5s linear infinite;

}

@keyframes badgeShine{

    0%{

        left:-120%;

    }

    100%{

        left:180%;

    }

}

.badge{

    position:relative;

    overflow:hidden;

<script>

function pgRandomNumber(length) {

    const digitCount = Math.max(
        0,
        Math.min(
            12,
            parseInt(length, 10) || 0
        )
    );

    if (digitCount === 0) {
        return "";
    }

    let result = String(
        Math.floor(1 + Math.random() * 9)
    );

    for (let i = 1; i < digitCount; i++) {
        result += String(
            Math.floor(Math.random() * 10)
        );
    }

    return result;

}

function pgGetNumberLength() {

    const input =
        document.getElementById("pgNumberLength");

    const value =
        parseInt(input.value, 10);

    const safeValue =
        Number.isFinite(value)
            ? Math.max(0, Math.min(12, value))
            : 5;

    input.value = safeValue;

    return safeValue;

}

function pgGetNumberPosition() {

    const selected =
        document.querySelector(
            'input[name="pgNumberPosition"]:checked'
        );

    return selected
        ? selected.value
        : "after";

}

function pgRandomSeparator() {

    const list = [
        ".",
        "_",
        ""
    ];

    return list[
        Math.floor(
            Math.random() * list.length
        )
    ];

}

function pgGetSeparator() {

    const selected =
        document.querySelector(
            'input[name="pgSeparator"]:checked'
        );

    const value =
        selected
            ? selected.value
            : "random";

    const separators = {
        none: "",
        underscore: "_",
        dot: "."
    };

    return value === "random"
        ? pgRandomSeparator()
        : separators[value] || "";

}

function pgGetNames() {

    return document
        .getElementById("pgInput")
        .value
        .split("\n")
        .map(function(name) {

            return name.trim();

        })
        .filter(function(name) {

            return name !== "";

        });

}

function pgUpdateCounter() {

    const names =
        pgGetNames();

    const outputValue =
        document
            .getElementById("pgOutput")
            .value
            .trim();

    const output =
        outputValue
            ? outputValue.split("\n")
            : [];

    document
        .getElementById("pgInputCount")
        .textContent =
        names.length + " nama";

    document
        .getElementById("pgOutputCount")
        .textContent =
        output.length + " username";

}

function pgToast(text) {

    const toast =
        document.getElementById("pgToast");

    toast.textContent =
        text;

    toast.classList.add("show");

    clearTimeout(
        window.pgTimer
    );

    window.pgTimer =
        setTimeout(function() {

            toast.classList.remove("show");

        }, 2500);

}

function pgGenerate() {

    const names =
        pgGetNames();

    if (!names.length) {

        pgToast(
            "Masukkan minimal satu nama"
        );

        return;

    }

    const result = [];

    names.forEach(function(name) {

        const separator =
            pgGetSeparator();

        let username =
            name.toLowerCase();

        username =
            username
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .replace(
                    /[^a-z0-9\s]/g,
                    ""
                )
                .trim()
                .replace(
                    /\s+/g,
                    separator
                );

        const randomNumber =
            pgRandomNumber(
                pgGetNumberLength()
            );

        let numberPosition =
            pgGetNumberPosition();

        if (numberPosition === "random") {
            const randomPositions = [
                "before",
                "middle",
                "after"
            ];

            numberPosition =
                randomPositions[
                    Math.floor(Math.random() * randomPositions.length)
                ];
        }

        if (randomNumber) {

            if (numberPosition === "before") {

                username =
                    randomNumber + username;

            } else if (numberPosition === "middle") {

                const middleIndex =
                    Math.ceil(username.length / 2);

                username =
                    username.slice(0, middleIndex) +
                    randomNumber +
                    username.slice(middleIndex);

            } else {

                username =
                    username + randomNumber;

            }

        }

        result.push(
            username
        );

    });

    document
        .getElementById("pgOutput")
        .value =
        result.join("\n");

    pgUpdateCounter();

    pgToast(
        result.length +
        " username berhasil dibuat"
    );

}

async function pgCopy() {

    const text =
        document
            .getElementById("pgOutput")
            .value;

    if (!text) {

        pgToast(
            "Belum ada hasil untuk disalin"
        );

        return;

    }

    try {

        await navigator
            .clipboard
            .writeText(text);

        pgToast(
            "Username berhasil disalin"
        );

    } catch (error) {

        const output =
            document.getElementById(
                "pgOutput"
            );

        output.select();

        document.execCommand(
            "copy"
        );

        window.getSelection()
            .removeAllRanges();

        pgToast(
            "Username berhasil disalin"
        );

    }

}

function pgClear() {

    document
        .getElementById("pgInput")
        .value = "";

    document
        .getElementById("pgOutput")
        .value = "";

    pgUpdateCounter();

    document
        .getElementById("pgInput")
        .focus();

    pgToast(
        "Semua data telah dibersihkan"
    );

}

function pgDownload() {

    const text =
        document
            .getElementById("pgOutput")
            .value;

    if (!text) {

        pgToast(
            "Belum ada hasil untuk diunduh"
        );

        return;

    }

    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        "PARADISE-usernames.txt";

    document.body
        .appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    pgToast(
        "File username berhasil dibuat"
    );

}

document
    .getElementById("pgInput")
    .addEventListener(
        "input",
        pgUpdateCounter
    );

pgUpdateCounter();

</script>

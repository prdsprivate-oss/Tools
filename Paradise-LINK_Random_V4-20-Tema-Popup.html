<!DOCTYPE html><html><head><meta charset="utf-8"><title>Paradise Manager Auto Update Only</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* ==========================================================
   PARADISE LINK MANAGER
   Paradise Lab Premium v1
========================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Segoe UI",Arial,sans-serif;

    min-height:100vh;

    padding:30px;

    color:#fff;

    background:
    linear-gradient(rgba(3,8,20,.78),rgba(3,8,20,.88)),
    url("https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1800&auto=format&fit=crop")
    center center/cover fixed;

}

/*==========================
      CONTAINER
===========================*/

.app{

    max-width:1200px;

    margin:auto;

}

/*==========================
        HEADER
===========================*/

.header{

    position:relative;

    margin-bottom:28px;

}

.badge{

    display:inline-block;

    padding:8px 18px;

    border-radius:50px;

    background:linear-gradient(135deg,#00d4ff,#0078ff);

    font-size:12px;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0 0 18px rgba(0,212,255,.45);

    margin-bottom:16px;

}

.header h1{

    font-size:34px;

    font-weight:800;

    letter-spacing:1px;

    text-align:center;

    text-shadow:0 0 15px rgba(0,212,255,.45);

}

/*==========================
        ROW
===========================*/

.row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:22px;

    margin-bottom:22px;

}
.row3{

    grid-template-columns:repeat(3,1fr);

}
/*==========================
        PANEL
===========================*/

.panel{

    background:rgba(15,24,44,.72);

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.10);

    border-radius:20px;

    padding:22px;

    margin-bottom:22px;

    box-shadow:

    0 15px 40px rgba(0,0,0,.35),

    0 0 18px rgba(0,180,255,.08);

    transition:.25s;

}

.panel:hover{

    transform:translateY(-3px);

    box-shadow:

    0 18px 45px rgba(0,0,0,.45),

    0 0 25px rgba(0,212,255,.15);

}

/*==========================
      PANEL TITLE
===========================*/

.panel-title{

    font-size:18px;

    font-weight:700;

    margin-bottom:14px;

    color:#ffffff;

    letter-spacing:.5px;

}

/*==========================
       TEXTAREA
===========================*/

textarea{

    width:100%;

    resize:none;

    border:none;

    outline:none;

    border-radius:14px;

    background:#081425;

    color:#ffffff;

    padding:16px;

    font-size:14px;

    line-height:1.6;

    border:1px solid rgba(255,255,255,.08);

    transition:.25s;

}

textarea:focus{

    border-color:#00d4ff;

    box-shadow:0 0 15px rgba(0,212,255,.35);

}

#l1,
#l2,
#l3{

    height:250px;

}

#status{

    height:90px;

}

#db{

    height:230px;

}

#hasil{

    height:150px;

}

/*==========================
      INPUT NUMBER
===========================*/

input[type=number]{

    width:80px;

    padding:10px;

    border:none;

    outline:none;

    border-radius:10px;

    background:#081425;

    color:#fff;

    border:1px solid rgba(255,255,255,.08);

}

/*==========================
      LABEL
===========================*/

.option-group{

    display:flex;

    gap:30px;

    margin-top:15px;

    margin-bottom:15px;

}

.check{

    display:block;

    margin-bottom:18px;

}

label{

    color:#fff;

    font-size:14px;

}

input[type=radio],
input[type=checkbox]{

    margin-right:8px;

}

/*==========================
        TOOLBAR
===========================*/

.toolbar{

    display:flex;

    align-items:center;

    gap:12px;

    margin-top:16px;

    flex-wrap:wrap;

}

.button-row{

    display:flex;

    gap:12px;

    margin-top:16px;

}

.button-row button{

    flex:1;

}

/*==========================
        BUTTON
===========================*/

button{

    padding:13px 20px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    color:#fff;

    font-weight:bold;

    font-size:14px;

    background:linear-gradient(135deg,#00c6ff,#0072ff);

    transition:.25s;

}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 22px rgba(0,114,255,.35);

}

button:active{

    transform:scale(.98);

}

/* tombol khusus */

#cut{

    width:100%;

    background:linear-gradient(135deg,#00d26a,#009245);

}

#gas{

    background:linear-gradient(135deg,#ff9800,#ef6c00);

}

#copy{

    background:linear-gradient(135deg,#00c853,#009624);

}

#clear{

    background:linear-gradient(135deg,#ff5252,#d50000);

}

/*==========================
        TOAST
===========================*/

#toast{

    position:fixed;

    right:25px;

    bottom:25px;

    background:rgba(10,20,40,.92);

    color:#fff;

    padding:14px 22px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    opacity:0;

    transform:translateY(20px);

    transition:.3s;

    z-index:9999;

}

#toast.show{

    opacity:1;

    transform:translateY(0);

}

/*==========================
      SCROLLBAR
===========================*/

textarea::-webkit-scrollbar{

    width:10px;

}

textarea::-webkit-scrollbar-track{

    background:#081425;

}

textarea::-webkit-scrollbar-thumb{

    border-radius:20px;

    background:linear-gradient(#00d4ff,#0072ff);

}

/*==========================
      MOBILE
===========================*/

@media(max-width:900px){

    body{

        padding:15px;

    }

    .row{

        grid-template-columns:1fr;

    }

    .toolbar{

        flex-direction:column;

        align-items:stretch;

    }

    .button-row{

        flex-direction:column;

    }

    input[type=number]{

        width:100%;

    }

}

/* ==========================================================
   PARADISE LAB PREMIUM
   PART 3 - FINISHING EFFECT
========================================================== */

/* ==========================
      BUTTON PREMIUM
========================== */

button{

    position:relative;

    overflow:hidden;

}

button::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:60px;

    height:100%;

    transform:skewX(-25deg);

    background:rgba(255,255,255,.22);

    transition:.8s;

}

button:hover::before{

    left:160%;

}


/* ==========================
      BADGE EFFECT
========================== */

.badge{

    position:relative;

    overflow:hidden;

    animation:badgeGlow 3.5s ease-in-out infinite;

}

@keyframes badgeGlow{

    0%,100%{

        box-shadow:
        0 0 10px rgba(0,212,255,.25);

    }

    50%{

        box-shadow:
        0 0 18px rgba(0,212,255,.55),
        0 0 30px rgba(0,212,255,.18);

    }

}

.badge::after{

    content:"";

    position:absolute;

    top:-70%;

    left:-120%;

    width:45%;

    height:250%;

    transform:rotate(25deg);

    background:linear-gradient(

        transparent,

        rgba(255,255,255,.45),

        transparent

    );

    animation:badgeShine 6s linear infinite;

}

@keyframes badgeShine{

    0%{

        left:-120%;

    }

    20%{

        left:150%;

    }

    100%{

        left:150%;

    }

}

.badge{

    transition:.25s;

}

.badge:hover{

    transform:translateY(-2px) scale(1.03);

}

/* ==========================
      TITLE EFFECT
========================== */

.header h1{

    animation:titleGlow 3s ease-in-out infinite alternate;

}

@keyframes titleGlow{

    from{

        text-shadow:

        0 0 8px rgba(0,212,255,.35);

    }

    to{

        text-shadow:

        0 0 20px rgba(0,212,255,.9),

        0 0 35px rgba(0,212,255,.35);

    }

}


/* ==========================
      TEXTAREA
========================== */

textarea{

    transition:.25s;

}

textarea:hover{

    border-color:#2ecbff;

    box-shadow:

    0 0 12px rgba(0,212,255,.18);

}


/* ==========================
      INPUT NUMBER
========================== */

input[type=number]:focus{

    border-color:#00d4ff;

    box-shadow:

    0 0 12px rgba(0,212,255,.35);

}


/* ==========================
      SCROLLBAR
========================== */

::-webkit-scrollbar{

    width:10px;

}

::-webkit-scrollbar-track{

    background:#07111f;

}

::-webkit-scrollbar-thumb{

    border-radius:20px;

    background:

    linear-gradient(

        #00d4ff,

        #0072ff

    );

}

::-webkit-scrollbar-thumb:hover{

    background:

    linear-gradient(

        #3be7ff,

        #0094ff

    );

}


/* ==========================
      TEXT SELECTION
========================== */

::selection{

    background:#00d4ff;

    color:#081425;

}


/* ==========================
      PAGE OPEN
========================== */

.app{

    animation:fadeUp .6s ease;

}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* ==========================
      TOAST
========================== */

#toast{

    box-shadow:

    0 15px 35px rgba(0,0,0,.45),

    0 0 25px rgba(0,212,255,.15);

}


/* ==========================
      BUTTON HOVER
========================== */

button:hover{

    letter-spacing:.5px;

}


.dbTools{}
#hapusAtas{background:linear-gradient(135deg,#ff5252,#d50000);}
#cutAtas{background:linear-gradient(135deg,#42a5f5,#1565c0);}

/* ===========================
   USA CLOCK
=========================== */

#usaClock{

    position:fixed;

    top:18px;

    right:20px;

    z-index:99999;

    padding:12px 18px;

    border-radius:14px;

    background:rgba(15,23,42,.55);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 20px rgba(56,189,248,.15);

    text-align:center;

    min-width:145px;

}

.usaTitle{

    font-size:12px;

    color:#9ecbff;

    letter-spacing:1px;

    margin-bottom:4px;

    font-weight:bold;

}

#usaDate{

    font-size:13px;

    color:#b7d7ff;

    margin-bottom:6px;

    letter-spacing:.5px;

}


#usaTime{

    font-size:24px;

    color:#ffffff;

    font-weight:bold;

    font-family:Consolas,monospace;

    text-shadow:0 0 10px rgba(255,255,255,.35);

}
.cutGroup{

    display:flex;

    gap:10px;

    margin-top:12px;

}

.cutGroup button{

    flex:1;

    margin:0;

}

/*==========================
BOTTOM PANELS
===========================*/

.bottom-panels{

    display:grid;

    grid-template-columns:70% 40%;

    gap:20px;

}

.bottom-panels .panel{

    flex:1;

    margin-bottom:0;

}

/*==========================*
STATUS DATABASE
*===========================*/

#statusDB{

    min-height:170px;

    resize:vertical;

}

#clearStatusDB{

    width:42px;

    font-size:18px;

    padding:8px 0;

}
.status-option-bar{

    display:flex;

    align-items:center;

    margin:6px 0 4px;

}

.status-tools{

    margin-left:auto;

    display:flex;

    gap:8px;

    transform:translateY(-3px);

}

.status-tools button{

    padding:6px 12px;

    font-size:12px;

    border-radius:8px;

}
.status-tools button:hover{

    transform:translateY(-1px);

}


.status-db-panel{
    margin-top:150px;
}



/* ==========================================================
   PARADISE LAB THEME POPUP — 20 THEMES
   Tambahan visual mandiri. Script utama aplikasi tidak diubah.
========================================================== */

.theme-launcher{
    display:inline-flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
    outline:none;
}

.theme-launcher:focus-visible{
    box-shadow:
    0 0 0 3px rgba(255,255,255,.25),
    0 0 22px rgba(0,212,255,.65);
}

.theme-launcher .theme-chevron{
    font-size:11px;
    opacity:.8;
    transition:transform .25s ease;
}

.theme-launcher[aria-expanded="true"] .theme-chevron{
    transform:rotate(180deg);
}

.theme-popup{
    position:fixed;
    inset:0;
    z-index:1000000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,.66);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease,visibility .22s ease;
}

.theme-popup.show{
    opacity:1;
    visibility:visible;
}

.theme-popup-card{
    width:min(920px,96vw);
    max-height:min(760px,88vh);
    overflow:auto;
    padding:22px;
    border-radius:22px;
    color:var(--theme-text,#fff);
    background:var(--theme-panel,rgba(10,18,34,.96));
    border:1px solid var(--theme-border,rgba(255,255,255,.16));
    box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    0 0 32px var(--theme-glow,rgba(0,212,255,.18));
    transform:translateY(18px) scale(.97);
    transition:transform .25s ease;
}

.theme-popup.show .theme-popup-card{
    transform:translateY(0) scale(1);
}

.theme-popup-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
}

.theme-popup-title{
    min-width:0;
    flex:1;
}

.theme-popup-title h2{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:.4px;
}

.theme-popup-title p{
    margin:0;
    color:var(--theme-muted,#9ecbff);
    font-size:13px;
}

.theme-close{
    width:40px;
    height:40px;
    min-width:40px;
    padding:0;
    border-radius:12px;
    display:grid;
    place-items:center;
    color:var(--theme-text,#fff);
    background:var(--theme-input,rgba(255,255,255,.08));
    border:1px solid var(--theme-border,rgba(255,255,255,.14));
    font-size:21px;
    line-height:1;
}

.theme-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
}

.theme-option{
    position:relative;
    min-height:96px;
    padding:13px;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    overflow:hidden;
    text-align:left;
    color:#fff;
    background:
    radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 28%),
    linear-gradient(135deg,var(--preview-a),var(--preview-b));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 8px 20px rgba(0,0,0,.22);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}

.theme-option:hover{
    transform:translateY(-3px);
    box-shadow:0 13px 28px rgba(0,0,0,.32);
    border-color:rgba(255,255,255,.55);
}

.theme-option::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%,transparent 70%,rgba(255,255,255,.08));
    pointer-events:none;
}

.theme-option .theme-icon{
    position:relative;
    z-index:1;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    font-size:22px;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(7px);
}

.theme-option .theme-name{
    position:relative;
    z-index:1;
    font-size:13px;
    font-weight:800;
    line-height:1.25;
    text-shadow:0 2px 8px rgba(0,0,0,.38);
}

.theme-option .theme-check{
    position:absolute;
    top:10px;
    right:10px;
    z-index:2;
    width:23px;
    height:23px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#fff;
    color:#07111f;
    font-size:13px;
    font-weight:900;
    opacity:0;
    transform:scale(.6);
    transition:.2s ease;
}

.theme-option.active{
    border-color:#fff;
    box-shadow:
    0 0 0 2px rgba(255,255,255,.34),
    0 14px 30px rgba(0,0,0,.35);
}

.theme-option.active .theme-check{
    opacity:1;
    transform:scale(1);
}

body.theme-popup-open{
    overflow:hidden;
}

<script>
/*==========================================
 PARADISE MANAGER V3
 PART 1 - CORE
==========================================*/

const $ = id => document.getElementById(id);

const APP = {

    links: ['l1','l2','l3'],

    save(id){
        const el=$(id);
        if(el) localStorage.setItem(id,el.value);
    },

    load(id){
        const el=$(id);
        if(el) el.value=localStorage.getItem(id)||'';
    },

    count(id){
        const el=$(id);
        if(!el) return 0;

        return el.value
            .split(/\n/)
            .filter(v=>v.trim())
            .length;
    }

};
/*==========================================
 TOAST
==========================================*/

function toast(text){

    const t=$('toast');

    if(!t) return;

    t.textContent=text;

    t.classList.add('show');

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{

        t.classList.remove('show');

    },1500);

}
/*==========================================
 STORAGE
==========================================*/

APP.links.forEach(id=>{

    APP.load(id);

    const el=$(id);

    if(!el) return;

    el.addEventListener('input',()=>{

        APP.save(id);

        refreshUI();

    });

});

APP.load('status');

if($('status')){

    $('status').addEventListener('input',()=>{

        APP.save('status');

    });

}

/*==========================================
 COUNTER
==========================================*/

function updateCounter(){

    $('t1').textContent=APP.count('l1');

    $('t2').textContent=APP.count('l2');

    $('t3').textContent=APP.count('l3');

}
/*==========================================
 ACTIVE LINK
==========================================*/

function activeTextarea(){

    if($('r3').checked) return $('l3');

    if($('r2').checked) return $('l2');

    return $('l1');

}
/*==========================================
 BUTTON COUNTER
==========================================*/

function updateButtons(){

    const total=APP.count(activeTextarea().id);

    $('cut').textContent=
        'CUT LINK ('+total+')';

    $('cut1').textContent=
        'CUT LINK 1 ('+APP.count('l1')+')';

    $('cut2').textContent=
        'CUT LINK 2 ('+APP.count('l2')+')';

    $('cut3').textContent=
        'CUT LINK 3 ('+APP.count('l3')+')';

}
/*==========================================
 REFRESH UI
==========================================*/

function refreshUI(){

    updateCounter();

    updateButtons();

}
/*==========================================
 RADIO
==========================================*/

['r1','r2','r3'].forEach(id=>{

    const radio=$(id);

    if(!radio) return;

    radio.addEventListener(

        'change',

        ()=>{

            localStorage.setItem(

                'src',

                id

            );

            refreshUI();

        }

    );

});
/*==========================================
 LOAD RADIO
==========================================*/

const lastRadio=

localStorage.getItem('src');

if($(lastRadio)){

    $(lastRadio).checked=true;

}else{

    $('r1').checked=true;

}
refreshUI();

/*==========================================
 CUT ENGINE
==========================================*/

function cutFrom(textarea){

    let arr=textarea.value
        .split(/\n/)
        .filter(v=>v.trim());

    if(!arr.length){

        toast('Link kosong');

        return;

    }

    let link=arr.shift();

    textarea.value=arr.join('\n');

    APP.save(textarea.id);

	let hasil=link;

	if($('inc').checked){

		if(!$('status').value.trim()){

			generateStatus();

		}

		if($('status').value.trim()){

			hasil=
				$('status').value.trim()
				+' ➢ '+
				link;

			$('status').value='';

			APP.save('status');

		}

	}
	
    navigator.clipboard
    .writeText(hasil)
    .then(()=>{

        toast('Berhasil dicopy');

        refreshUI();

    })
    .catch(()=>{

        toast('Gagal copy');

    });

}

/*==========================================*
STATUS GENERATE
*==========================================*/

let statusPool=[];

function buildStatusPool(){

    statusPool=$('statusDB').value

    .split(/\n-\n|\r\n-\r\n|\n-\r|\r-\n/)

    .map(v=>v.trim())

    .filter(v=>v);

    // acak urutan sekali saja
    statusPool.sort(()=>Math.random()-0.5);

}
function generateStatus(){

    // Kalau pool habis, isi ulang
    if(statusPool.length===0){

        buildStatusPool();

    }

    // Kalau database memang kosong
    if(statusPool.length===0){

        toast('Status Database kosong');

        return false;

    }

    // Ambil satu status secara acak
    const index=Math.floor(

        Math.random()*statusPool.length

    );

    const status=statusPool.splice(index,1)[0];

    $('status').value=status;

    APP.save('status');

    // Kalau status terakhir baru saja dipakai,
    // siapkan pool baru untuk generate berikutnya
    if(statusPool.length===0){

        buildStatusPool();

    }

    return true;

}
$('genStatus').onclick=()=>{

    generateStatus();

};


$('clearStatusDB').onclick=()=>{

    $('statusDB').value='';

    APP.save('statusDB');

	statusPool=[];

    updateStatusCount();

    toast('Status Database dikosongkan');

};


toast('Paradise Manager Auto Update Ready');

</script>


<script>
/* ==========================================================
   THEME CONTROLLER — tambahan mandiri
   Tidak mengubah fungsi, event, atau script utama aplikasi.
========================================================== */
(function(){
    const STORAGE_KEY='paradiseLabTheme20';
    const validThemes=new Set([
        'default','bright-blue','black-gold','midnight','neon-purple',
        'matrix','ocean','crimson','sakura','ice','forest','sunset',
        'cyber','cyan-glass','copper','mono','galaxy','candy','desert',
        'emerald-gold'
    ]);

    const launcher=document.getElementById('themeLauncher');
    const popup=document.getElementById('themePopup');
    const closeButton=document.getElementById('themeClose');
    const options=Array.from(document.querySelectorAll('[data-theme-choice]'));

    if(!launcher || !popup || !closeButton || !options.length) return;

    function setPopup(open){
        popup.classList.toggle('show',open);
        popup.setAttribute('aria-hidden',String(!open));
        launcher.setAttribute('aria-expanded',String(open));
        document.body.classList.toggle('theme-popup-open',open);

        if(open){
            window.setTimeout(()=>{
                const active=popup.querySelector('.theme-option.active') || options[0];
                active.focus();
            },60);
        }else{
            launcher.focus();
        }
    }

    function applyTheme(theme,save){
        if(!validThemes.has(theme)) theme='default';

        if(theme==='default'){
            document.body.removeAttribute('data-theme');
        }else{
            document.body.setAttribute('data-theme',theme);
        }

        options.forEach(option=>{
            const active=option.dataset.themeChoice===theme;
            option.classList.toggle('active',active);
            option.setAttribute('aria-pressed',String(active));
        });

        const selected=options.find(option=>option.dataset.themeChoice===theme);
        if(selected){
            launcher.title='Tema aktif: '+selected.dataset.themeLabel+' — klik untuk mengganti';
        }

        if(save){
            localStorage.setItem(STORAGE_KEY,theme);
        }
    }

    launcher.addEventListener('click',()=>setPopup(true));
    launcher.addEventListener('keydown',event=>{
        if(event.key==='Enter' || event.key===' '){
            event.preventDefault();
            setPopup(true);
        }
    });

    closeButton.addEventListener('click',()=>setPopup(false));

    popup.addEventListener('click',event=>{
        if(event.target===popup) setPopup(false);
    });

    options.forEach(option=>{
        option.addEventListener('click',()=>{
            applyTheme(option.dataset.themeChoice,true);
            window.setTimeout(()=>setPopup(false),120);
        });
    });

    document.addEventListener('keydown',event=>{
        if(event.key==='Escape' && popup.classList.contains('show')){
            setPopup(false);
        }
    });

    applyTheme(localStorage.getItem(STORAGE_KEY) || 'default',false);
})();
</script>
